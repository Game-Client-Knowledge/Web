server {
    listen 127.0.0.1:8788;
    server_name knowledge.chenyurui.top;

    root /var/www/game-client-knowledge/current;
    index index.html;

    access_log /var/log/nginx/game-client-knowledge.access.log;
    error_log /var/log/nginx/game-client-knowledge.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /search-index.json {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
