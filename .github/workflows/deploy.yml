name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - content-updated
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout knowledge content
        uses: actions/checkout@v4
        with:
          repository: Game-Client-Knowledge/Game-Client-Knowledge
          ref: main
          path: _content
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages base path
        shell: bash
        env:
          CONFIGURED_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ -n "$CONFIGURED_BASE_PATH" ]]; then
            base_path="$CONFIGURED_BASE_PATH"
          elif [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            base_path=""
          else
            base_path="/$REPOSITORY_NAME"
          fi
          echo "SITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Audit content and build
        env:
          CONTENT_REPO_PATH: ${{ github.workspace }}/_content
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
